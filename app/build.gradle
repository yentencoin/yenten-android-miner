apply plugin: 'com.android.application'

android {
    namespace 'com.example.ottylab.bitzenyminer'
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.example.yentencoin.yentenminer"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 3
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions 'default'
    productFlavors {
        standard {
        }
    }
}

dependencies {
    implementation project(':bitzenymininglibrary')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.microsoft.appcenter:espresso-test-extension:1.2'
}
